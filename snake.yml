name: generate-snake

on:
  schedule:
    - cron: "0 */6 * * *"   # runs every 6 hours
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ShaazKazi
          outputs: |
            dist/github-snake.svg?color_snake=%23CA88DF&color_dots=%230D1117,%233C1361,%236A2C91,%239D5FD1,%23CA88DF
            dist/github-snake-dark.svg?color_snake=%23CA88DF&color_dots=%230D1117,%233C1361,%236A2C91,%239D5FD1,%23CA88DF

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
